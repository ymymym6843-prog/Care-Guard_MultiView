services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentio
      POSTGRES_USER: sentio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentio_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentio"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # DB URL은 compose 수준에서 조합 필요
      DATABASE_URL: postgresql+asyncpg://sentio:${POSTGRES_PASSWORD:-sentio_secret}@db:5432/sentio
    env_file:
      - .env.docker
    volumes:
      - ./demo_videos:/demo_videos:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    # GPU 카메라가 필요한 경우 아래 주석 해제
    # devices:
    #   - "/dev/video0:/dev/video0"

  frontend-build:
    build: ./frontend
    volumes:
      - frontend_dist:/dist
    entrypoint: ["sh", "-c", "cp -r /usr/share/nginx/html/* /dist/"]

  go2rtc:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      INTERNAL_STREAM_KEY: ${INTERNAL_STREAM_KEY:-sentio-internal-stream-key-change-in-production}
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    # 외부에서 직접 접근 불필요 (nginx 프록시 사용)
    # ports:
    #   - "1984:1984"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend-build:
        condition: service_completed_successfully
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro

volumes:
  pgdata:
  frontend_dist:
