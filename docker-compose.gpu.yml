# SENTIO GPU Docker Compose Override
# 사용법: docker-compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# 사전 요구사항:
#   1. NVIDIA GPU 드라이버 설치 (호스트)
#   2. NVIDIA Container Toolkit 설치
#      - Linux: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#      - Windows: Docker Desktop > Settings > Resources > GPU 활성화
#
# GPU 확인: docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      YOLO_USE_GPU: "true"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
